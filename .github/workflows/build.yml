# Builds Dracora on every push and pull request, then tests what it built:
# - build: the Fabric and NeoForge jars, attached to the run as "Downloads".
# - game: the in-game test (fabric/src/gametest) in a real game, with screenshots.
#   It runs three times: on its own, with Terralith (which changes the Overworld's biomes and
#   peaks) and with Stellarity (which rebuilds the End), so a clash shows up straight away.
# - game (NeoForge): vanilla's test server runs the NeoForge jar's own checks (neoforge/src/gametest).
#   No window needed.

name: build
on:
  push:
    paths-ignore:
      - '**.md'
      - 'art/**'
      - 'LICENSE'
  pull_request:
  # Run by hand from the Actions tab (or `gh workflow run build`).
  workflow_dispatch:

# A newer push to the same branch stops the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: the mods
        run: |
          chmod +x ./gradlew
          ./gradlew build
          mkdir -p dist
          cp fabric/build/libs/dracora-fabric-*.jar neoforge/build/libs/dracora-neoforge-*.jar dist/
          rm -f dist/*-sources.jar
          ls dist/
      - name: capture the downloads
        uses: actions/upload-artifact@v7
        with:
          name: Downloads
          path: dist/

  game:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'on its own'
            test_args: ''
          - variant: 'with Terralith'
            test_args: '-PtestTerralith'
          - variant: 'with Stellarity'
            test_args: '-PtestStellarity'
    name: game (${{ matrix.variant }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: install EGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      - name: game test
        # 26.3 asks for an sRGB-capable window, which Xvfb's GLX can't give, so the game would hang
        # at startup. Mesa's EGL can; SDL uses it with this set.
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          xvfb-run -a ./gradlew :fabric:runClientGameTest ${{ matrix.test_args }}
      - name: capture the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (${{ matrix.variant }})
          path: fabric/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore

  game-neoforge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: game test
        # A dedicated test server: no window, so no virtual display needed.
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          ./gradlew :neoforge:runGameTestServer
